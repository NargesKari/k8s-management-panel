global:
  scrape_interval: 15s

scrape_configs:
  - job_name: kari-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]

  - job_name: kari-celery-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:9101"]

  - job_name: victoriametrics
    static_configs:
      - targets: ["victoriametrics:8428"]

  - job_name: vmagent
    static_configs:
      - targets: ["vmagent:8429"]
