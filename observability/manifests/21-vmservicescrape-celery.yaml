# Scrapes the Celery worker's own metrics server (see
# backend/kari_backend/worker_metrics.py). The backup metrics are recorded
# in the worker process, not the web process, so this is a separate target.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: kari-celery-worker
  namespace: monitoring-system
spec:
  namespaceSelector:
    matchNames:
      - kari-panel
  selector:
    matchLabels:
      app: celery-worker
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s
