# EXAMPLE ONLY. Copy to 05-grafana-secret.yaml, set a real password, and
# keep that copy out of git (it is listed in .gitignore).
#
#   cp 05-grafana-secret.example.yaml 05-grafana-secret.yaml
#   # edit the password
#   kubectl apply -f 05-grafana-secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin
  namespace: monitoring-system
type: Opaque
stringData:
  username: "admin"
  password: "CHANGE-ME"
