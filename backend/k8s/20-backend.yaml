apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: kari-panel
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/nargeskari/kari-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: kari-config
            - secretRef:
                name: kari-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: kari-panel
spec:
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
