apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-worker
  namespace: kari-panel
spec:
  replicas: 1
  selector:
    matchLabels:
      app: celery-worker
  template:
    metadata:
      labels:
        app: celery-worker
    spec:
      containers:
        - name: celery-worker
          image: ghcr.io/nargeskari/kari-backend:latest
          imagePullPolicy: Always
          command: ["celery", "-A", "kari_backend", "worker", "-l", "info"]
          ports:
            # Exposed by kari_backend/worker_metrics.py so VMAgent can
            # scrape the backup metrics recorded inside the worker.
            - name: metrics
              containerPort: 9101
          envFrom:
            - configMapRef:
                name: kari-config
            - secretRef:
                name: kari-secrets
          volumeMounts:
            - name: backups-storage
              mountPath: /backups
      volumes:
        - name: backups-storage
          persistentVolumeClaim:
            claimName: backups-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: celery-worker-metrics
  namespace: kari-panel
  labels:
    app: celery-worker
spec:
  selector:
    app: celery-worker
  ports:
    - name: metrics
      port: 9101
      targetPort: metrics
