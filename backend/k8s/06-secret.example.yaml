# This is an EXAMPLE. Copy it to 06-secret.yaml, fill in real values, and
# make sure 06-secret.yaml is listed in .gitignore so real secrets never
# get committed to the repo.
apiVersion: v1
kind: Secret
metadata:
  name: kari-secrets
  namespace: kari-panel
type: Opaque
stringData:
  POSTGRES_DB: "kari"
  POSTGRES_USER: "kari"
  POSTGRES_PASSWORD: "CHANGE-ME"
  DJANGO_SECRET_KEY: "CHANGE-ME-to-a-long-random-string"
