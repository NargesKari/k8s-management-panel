# Serves the exact same frontend build under /frontend as an alternate
# entry point, alongside the "/" ingress (32-ingress-frontend.yaml). No
# stripPrefix middleware is used here on purpose: the React app itself
# detects the "/frontend" prefix at runtime (see frontend/src/main.jsx)
# and sets React Router's basename accordingly, so both URLs work with
# one build and no server-side rewriting.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kari-ingress-frontend-alias
  namespace: kari-panel
  annotations:
    kubernetes.io/ingress.class: traefik
spec:
  rules:
    - host: kari.osdl.ir
      http:
        paths:
          - path: /frontend
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
